<!DOCTYPE html>

<html>

<head>

    <meta charset="UTF-8">

    <title>
        Create Exam
    </title>

    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">

</head>

<body>


    <nav>

        <div class="logo">
            Create Exam
        </div>

        <div>

            <a href="{{ url_for('admin_dashboard') }}">
                Dashboard
            </a>

            <a href="{{ url_for('logout') }}">
                Logout
            </a>

        </div>

    </nav>


    <div class="form-container">

        <h2>
            Create New Examination
        </h2>


        {% with messages =
        get_flashed_messages() %}

        {% if messages %}

        {% for message in messages %}

        <div class="alert">

            {{ message }}

        </div>

        {% endfor %}

        {% endif %}

        {% endwith %}


        <form method="POST">

            <label>
                Exam Title
            </label>

            <input type="text" name="title" placeholder="Example: Python Test" required>


            <label>
                Duration (Minutes)
            </label>

            <input type="number" name="duration" min="1" required>


            <button class="btn full" type="submit">

                Create Exam

            </button>

        </form>

    </div>

</body>

</html>
